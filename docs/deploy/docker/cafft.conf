# ============================================================================
#  CAFFT-IA  —  nginx configuration for the cafft-nginx container
# ============================================================================
#
#  Mounted at /etc/nginx/conf.d/default.conf, so this file is included inside
#  the stock image's `http { }` block. That is why limit_req_zone can live here
#  instead of in nginx.conf.
#
#  Traefik terminates TLS and forwards the request with its path intact, so
#  this server sees /cafft/... exactly as the browser sent it. Only requests
#  matching PathPrefix(`/cafft`) are routed here at all — PAUSAT's own nginx is
#  a separate container and is never touched by this deployment.
#
#  Layout inside the container:
#    /var/www/cafft-site/cafft/                 the built app
#    /srv/cafft/videos/                         the mp4 assets
#    /etc/nginx/private/cafft-gemini-key.conf   the Gemini key
#
#  The app lives in a `cafft/` subdirectory of its own document root so these
#  locations can use `root` rather than `alias`: `alias` combined with
#  `try_files` is a long-standing source of subtly broken nginx configs.
#
#  IMPORTANT nginx behaviour: `add_header` in a location block REPLACES the
#  headers inherited from the server block rather than merging with them. Every
#  location below therefore repeats the full header set.
# ============================================================================

# Rate limit for the Gemini proxy. The proxy keeps the API key server-side so it
# can no longer be stolen from the JS bundle, but the endpoint itself is
# unauthenticated: without a limit, anyone who finds it can spend the project's
# Gemini quota.
limit_req_zone $binary_remote_addr zone=cafft_genai:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    root /var/www/cafft-site;

    # Traefik terminates TLS, so $scheme is "http" in here. An absolute redirect
    # would therefore send the browser to http://pausat.uib.es/cafft/ and
    # downgrade the connection. Relative Location headers are resolved by the
    # browser against the URL it actually requested, which is https.
    absolute_redirect off;

    # Only Traefik can reach this container — no port is published to the host —
    # so its X-Forwarded-For is trustworthy. Without this, every request would
    # appear to come from the Traefik container and the rate limit above would
    # throttle all users as if they were one client.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # woff2 and mp4 are already compressed; gzipping them only burns CPU.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app posts chat messages, nothing larger.
    client_max_body_size 1m;

    # --- /cafft -> /cafft/ --------------------------------------------------
    # Without this redirect, visiting /cafft (no trailing slash) makes the
    # browser resolve the page's relative URLs against / instead of /cafft/.
    location = /cafft {
        return 301 /cafft/;
    }

    # --- index.html ---------------------------------------------------------
    # Must never be cached: it references hash-named assets, so a stale copy
    # points at files that no longer exist after a deploy.
    location = /cafft/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: blob:; media-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- hash-named build output --------------------------------------------
    # Filenames change whenever contents change, so these can be cached forever.
    location /cafft/assets/ {
        # No `always` on this one, deliberately. `always` would send the header
        # on error responses too, so a 404 for a not-yet-uploaded asset would be
        # cached by the browser for a year. Without it nginx only sets the
        # header on 2xx/3xx. The security headers below DO use `always` — those
        # should apply to error responses as well.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: blob:; media-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        access_log off;
    }

    # --- video assets -------------------------------------------------------
    # Served from outside the app directory so redeploying the app never touches
    # (or re-uploads) gigabytes of video. `alias` is safe here — no try_files.
    location /cafft/videos_cafft/ {
        alias /srv/cafft/videos/;

        # Byte-range support is what lets playback start before the whole file
        # has downloaded. nginx's static handler sets Accept-Ranges itself, so
        # declaring it here as well only produces a duplicate header — verify it
        # with a `Range:` request (expect 206) rather than re-adding it.

        # No `always`: see the note in /cafft/assets/. A 404 for a video that
        # has not been uploaded yet must not be cached for a month — that is
        # exactly what bites you when the file appears later.
        add_header Cache-Control "private, max-age=2592000";
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Never expose a directory listing of the clinical material.
        autoindex off;
    }

    # --- Gemini API proxy ---------------------------------------------------
    # The browser calls <origin>/cafft/genai/v1beta/models/... and nginx
    # forwards it to Google with the real key attached. This solves two
    # problems at once:
    #   1. the API key stays on the server instead of sitting in the JS bundle;
    #   2. the call is same-origin, so `connect-src 'self'` permits it.
    location /cafft/genai/ {
        # Only the verbs the SDK uses.
        limit_except GET POST {
            deny all;
        }

        limit_req zone=cafft_genai burst=10 nodelay;

        # The trailing slash on both sides strips the prefix:
        #   /cafft/genai/v1beta/models/x  ->  https://<google>/v1beta/models/x
        # Keep it a literal URL (no variables) so nginx resolves the hostname at
        # startup via Docker's embedded DNS and no `resolver` directive is
        # needed. The flip side: if Google rotates the address, restart the
        # container to pick up the new one.
        proxy_pass https://generativelanguage.googleapis.com/;

        proxy_http_version 1.1;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_ssl_server_name on;

        # We are handing Google an API key, so verify we are really talking to
        # Google. If nginx refuses to start complaining about this file, the
        # image lacks ca-certificates — comment these three lines out.
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        # Injects the real key, overwriting the placeholder the client sends.
        # That file holds exactly one line:
        #   proxy_set_header X-Goog-Api-Key "AIza...";
        include /etc/nginx/private/cafft-gemini-key.conf;

        # Never forward browser credentials upstream to Google.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Referer "";

        # The chat streams over server-sent events; buffering would withhold the
        # response and make replies appear all at once at the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        # The browser sees this as same-origin, so no CORS headers are needed —
        # drop anything Google sends to avoid conflicting values.
        proxy_hide_header Access-Control-Allow-Origin;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- everything else under /cafft/ --------------------------------------
    # Declared last: nginx picks the longest matching prefix, so the more
    # specific locations above win regardless of order.
    location /cafft/ {
        # The app uses HashRouter, so every route lives under /cafft/#/... and
        # the only real path is /cafft/. The fallback keeps direct deep links
        # working.
        try_files $uri $uri/ /cafft/index.html;

        # CAFFT self-hosts Tailwind, fonts and video, and reaches Gemini through
        # the same-origin proxy above, so it needs no CSP exceptions.
        #
        # If the browser console reports a style-src violation after deploying,
        # a component library is injecting a <style> element at runtime; append
        # 'unsafe-inline' to style-src ONLY — never to script-src.
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: blob:; media-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
