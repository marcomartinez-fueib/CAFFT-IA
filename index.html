<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UIB CAFFT 5.1 Program</title>
  <!-- Vite rewrites this to <base>/favicon.svg at build time. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!--
    Fonts (Montserrat, Space Grotesk, Inter), the Tailwind stylesheet and all
    custom CSS are bundled from index.tsx / index.css. Nothing is loaded from a
    CDN at runtime, so the app satisfies a strict
    `script-src 'self'; style-src 'self'` Content-Security-Policy.
    Tailwind theme tokens live in tailwind.config.js.
  -->
</head>
<body class="bg-white text-uib-black h-full selection:bg-uib-blue selection:text-white">
  <div id="root" class="h-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
