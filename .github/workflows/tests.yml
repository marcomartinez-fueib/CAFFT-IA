# ---------------------------------------------------------------------------
# CAFFT — test suite, shared by ci.yml (dev and pull requests) and deploy.yml
# (pre and pro). Runs on GitHub-hosted runners: it never touches the server.
# ---------------------------------------------------------------------------
name: Tests

on:
  workflow_call:

jobs:
  tests:
    name: Lint, API and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install
        run: npm ci && npm --prefix server ci

      - name: Type check
        run: npm run lint

      # No text of the interface left untranslated in Spanish or English.
      - name: Translations
        run: npm run check:translations

      - name: API tests
        run: npm run test:api

      # The API runs from its own image, which holds only server/: an import
      # from outside it passes the tests above and breaks in production.
      - name: API image starts
        run: |
          docker build -q -t cafft-api-ci server
          docker run -d --name cafft-api-ci -e DB_PATH=/tmp/ci.db -e BACKUP_DIR= cafft-api-ci
          for i in $(seq 1 30); do
            if docker exec cafft-api-ci node -e "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; then exit 0; fi
            sleep 1
          done
          docker logs cafft-api-ci
          exit 1

      # The end-to-end run arrives with the fita 1 work; skip it on commits that
      # do not have it yet.
      - name: End-to-end
        run: |
          if [ ! -f e2e/run.mjs ]; then echo "no e2e/ in this commit: skipped"; exit 0; fi
          # The runner image ships Google Chrome; installing Playwright's
          # browser needs apt, which fails whenever Ubuntu's mirrors do.
          if command -v google-chrome >/dev/null; then
            export CHROME_PATH=$(command -v google-chrome)
          else
            npx playwright-core install --with-deps chromium-headless-shell
          fi
          # With the accessibility check of every screen (e2e/a11y.mjs).
          A11Y=1 npm run test:e2e
